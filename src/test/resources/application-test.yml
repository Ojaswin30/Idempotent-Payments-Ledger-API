spring:
  application:
    name: idempotent-payments-ledger-test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  idempotency:
    in-progress-ttl-seconds: 10
    completed-ttl-seconds: 3600
  outbox:
    polling-rate-ms: 200
    batch-size: 10
    max-retries: 3
    base-backoff-ms: 100
  kafka:
    topics:
      payment-events: test.payments.events
      payment-events-dlq: test.payments.events.dlq
